services:
  pgdb:
    image: postgres:17
    container_name: adcoexp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: Asia/Bangkok
    ports:
      # Localhost-only: never expose Postgres to the network. A 0.0.0.0
      # binding invited brute-force attacks (rogue superusers, locked-out
      # postgres role). The harness talks to pgdb over the compose network.
      - "127.0.0.1:5432:5432"
    platform: linux/amd64
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    shm_size: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    image: postgres:17
    container_name: adcoexp-db-init
    restart: "no"
    platform: linux/amd64
    environment:
      PGHOST: pgdb
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      TZ: Asia/Bangkok
    depends_on:
      pgdb:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 <<-EOSQL
          SELECT 'CREATE DATABASE agenttune' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agenttune')\gexec
          SELECT 'CREATE DATABASE gptuner' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'gptuner')\gexec
          SELECT 'CREATE DATABASE smallbank' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'smallbank')\gexec
          SELECT 'CREATE DATABASE tpcc' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'tpcc')\gexec
          SELECT 'CREATE DATABASE adcodb' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'adcodb')\gexec
          SELECT 'CREATE DATABASE baselinedb' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'baselinedb')\gexec
        EOSQL

  adcoexp:
    build: .
    image: adcoexp-image
    container_name: adcoexp
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
    volumes:
      - .:/app # root-level download and experiment scripts
      - /var/run/docker.sock:/var/run/docker.sock 
      - ${HOME}/.config/gcloud/application_default_credentials.json:/var/run/secrets/google/application_default_credentials.json:ro
    depends_on:
      pgdb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:1.99.1
    container_name: adcoexp-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT must be set}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
    volumes:
      - ./docker/litellm-config.yaml:/app/config.yaml:ro
      - ${HOME}/.config/gcloud/application_default_credentials.json:/var/run/secrets/google/application_default_credentials.json:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv4: "true"
      com.docker.network.enable_ipv6: "false"
